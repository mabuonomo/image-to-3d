services:
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: image-to-3d-worker
    ports:
      - "${WORKER_PORT:-8000}:8000"
    environment:
      - HUNYUAN_MODEL_ID=${HUNYUAN_MODEL_ID:-tencent/Hunyuan3D-2mini}
      - HUNYUAN_SUBFOLDER=${HUNYUAN_SUBFOLDER:-hunyuan3d-dit-v2-mini}
      - ENABLE_TEXTURE=${ENABLE_TEXTURE:-true}
      - HF_HOME=${HF_HOME:-/models/huggingface}
      - HF_TOKEN=${HF_TOKEN:-}
      - DATA_DIR=/data
      - MODELS_DIR=/models
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - ./data:/data
      - ./models:/models
      - ./apps/worker/app:/app/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: image-to-3d-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - WORKER_INTERNAL_URL=${WORKER_INTERNAL_URL:-http://worker:8000}
      - NEXT_PUBLIC_WORKER_URL=${NEXT_PUBLIC_WORKER_URL:-http://localhost:8000}
    depends_on:
      - worker
    restart: unless-stopped
